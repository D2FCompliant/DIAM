name = "diam"
main = "worker/index.mjs"
compatibility_date = "2026-09-02"
keep_vars = true

[assets]
directory = "./dist"
binding = "ASSETS"

[vars]
APP_NAME = "DIAM SaaS"
OPENAI_MODEL = "gpt-5"
SUPABASE_URL = "https://wyvdcuhqewvvcqmdhtqt.supabase.co"
SAE_PROVIDER = "STRATOW_SYLOW"
SAE_ENABLED = "false"

# Secrets à définir avant déploiement :
# wrangler secret put SUPABASE_SERVICE_ROLE_KEY
# ou, en développement seulement si les politiques Supabase l'autorisent :
# wrangler secret put SUPABASE_PUBLISHABLE_KEY
# wrangler secret put DIAM_OWNER_EMAIL
# wrangler secret put OPENAI_API_KEY
# wrangler secret put SAE_ENDPOINT
# wrangler secret put SAE_API_KEY
